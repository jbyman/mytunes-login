<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>mytunes</title>
<style>
  :root { color-scheme: light dark; --bg: #f4f5f2; --text: #121512; --muted: #66706a; --accent: #16a34a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b0d0c; --text: #eef2ef; --muted: #98a39c; --accent: #22c55e; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  .box { text-align: center; padding: 24px; }
  .spin { width: 28px; height: 28px; border: 3px solid color-mix(in srgb, var(--accent) 25%, transparent);
          border-top-color: var(--accent); border-radius: 50%; margin: 0 auto 16px; animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg) } }
  p { color: var(--muted); margin: 0; }
  a { color: var(--accent); }
</style>
</head>
<body>
<div class="box">
  <div class="spin"></div>
  <p id="msg">Signing you in to mytunes…</p>
</div>
<script>
// Spotify only redirects to HTTPS (or loopback) addresses, and mytunes lives on the home
// network at http://mytunes.local. This page is the HTTPS stop: it hands Spotify's one-time
// code straight back to mytunes in the same browser. The code is useless without the
// secret verifier that only the mytunes server holds (PKCE), and nothing is stored here.
// The last part of `state` says which address the login started from; only these are allowed.
(function () {
  var homes = {
    m: "http://mytunes.local",
    i: "http://192.168.4.48:8899",
    l: "http://127.0.0.1:8899"
  };
  var q = new URLSearchParams(location.search);
  var state = q.get("state") || "";
  var home = homes[state.split("~").pop()] || homes.m;
  var target = home + "/callback" + location.search;
  document.getElementById("msg").innerHTML =
    'Signing you in to mytunes… <a href="' + target.replace(/"/g, "&quot;") + '">Continue</a>';
  location.replace(target);
})();
</script>
</body>
</html>
